# Round-16 stable capability report: the 18-case promoted dataset with each
# case's own threat model, 2 trials per case, current default prompt.
trials = 2
workers = 4
use_plan_instruction = false

[prompts]
default = "prompts/audit.txt"

[limits]
model = "deepseek-flash"
endpoint = "https://api.deepseek.com/chat/completions"
max_tokens = 32768
max_tool_calls = 16
timeout_ms = 600000
max_attempts = 5
reasoning_effort = "low"
max_stream_bytes = 8388608
jobs = 1

[[datasets]]
path = "datasets/tiny/ajna-protocol-compromise-2/audit/dataset.json"
case = "unsettled-bad-debt-liquidation"

