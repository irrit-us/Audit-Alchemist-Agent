[package]
name = "audit-harness"
version = "0.1.0"
edition = "2021"
description = "Bounded CLI execution and reproducible evaluation for vulnerability discovery agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/irrit-us/Audit-Alchemist-Agent"
keywords = ["security", "vulnerability", "audit", "llm"]
categories = ["command-line-utilities", "development-tools"]
default-run = "audit-harness"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
