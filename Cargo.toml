[package]
name = "audit-harness"
version = "0.1.0"
edition = "2021"
description = "Bounded CLI execution and reproducible evaluation for vulnerability discovery agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/irrit-us/Audit-Alchemist-Agent"
keywords = ["security", "vulnerability", "audit", "llm"]
categories = ["command-line-utilities", "development-tools"]
default-run = "audit-harness"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
